[package]
name = "margin-openmls-feasibility"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_traits = "=0.6.0"
wasm-bindgen = "=0.2.114"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RustCrypto's older RNG is used by credential key generation as well as the
# current RNG used by OpenMLS; both need their official browser backend.
getrandom_old = { package = "getrandom", version = "0.2", features = ["js"] }
