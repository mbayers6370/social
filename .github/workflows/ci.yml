name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: margin_admin
          # Public fixture password, only for this disposable CI container.
          POSTGRES_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U margin_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARGIN_CI_POSTGRES: "1"
      MARGIN_PG_BIN: /usr/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Save failed browser reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/verify-*/playwright-report/**
            .local/verify-*/test-results/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
