<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="margin-icon" data-animate="true" data-paused="false" role="img" aria-label="Lock">
<title>Lock</title>
<style>
/* Margin Editorial Geometry — import once at your app root. */
.margin-icon { display: inline-block; flex-shrink: 0; vertical-align: middle; }
.margin-icon [class^="margin-"], .margin-icon [class*=" margin-"] {
  transform-box: view-box; transform-origin: 12px 12px;
}
.margin-icon[data-animate="true"] .margin-eq-bar { animation: margin-equalize 1.15s ease-in-out infinite alternate; }
.margin-icon[data-animate="true"] .margin-eq-bar-1 { animation-duration: 1.15s; animation-delay: -.35s; }
.margin-icon[data-animate="true"] .margin-eq-bar-2 { animation-duration: .87s; animation-delay: -.55s; }
.margin-icon[data-animate="true"] .margin-eq-bar-3 { animation-duration: 1.31s; animation-delay: -.8s; }
.margin-icon[data-animate="true"] .margin-eq-bar-4 { animation-duration: .97s; animation-delay: -.18s; }
.margin-icon[data-animate="true"] .margin-settle { animation: margin-settle 360ms ease-out both; }
.margin-icon[data-animate="true"] .margin-pulse { animation: margin-pulse 420ms ease-in-out both; }
.margin-icon[data-animate="true"] .margin-swing { transform-origin: 12px 5px; animation: margin-swing 540ms ease-in-out both; }
.margin-icon[data-animate="true"] .margin-space-left { animation: margin-space-left 720ms ease-in-out both; }
.margin-icon[data-animate="true"] .margin-space-right { animation: margin-space-right 720ms ease-in-out both; }
.margin-icon[data-animate="true"] .margin-aperture { animation: margin-aperture 480ms ease-out both; }
.margin-icon[data-animate="true"] .margin-send { animation: margin-send 360ms ease-out both; }
.margin-icon[data-animate="true"] .margin-shackle { transform-origin: 8px 10px; animation: margin-shackle 720ms ease-in-out both; }
.margin-icon[data-animate="true"] .margin-page { animation: margin-page 440ms ease-out both; }
.margin-icon[data-animate="true"] .margin-draw { animation: margin-draw 360ms ease-out both; }
/* Explicit pausing returns a legible, static glyph. */
.margin-icon[data-paused="true"] *,
.margin-icon[data-motion="off"] *,
[data-margin-motion="off"] .margin-icon * { animation: none !important; }
@keyframes margin-equalize { from { transform: scaleY(.65); } to { transform: scaleY(1.12); } }
@keyframes margin-settle { from { transform: translateY(-1px); } to { transform: translateY(0); } }
@keyframes margin-pulse { 0%,100% { transform: scale(1); } 45% { transform: scale(1.07); } }
@keyframes margin-swing { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 65% { transform: rotate(5deg); } }
@keyframes margin-space-left { 0%,12% { transform: translateX(-3.2px) scale(.68); } 100% { transform: translateX(0) scale(1); } }
@keyframes margin-space-right { 0%,12% { transform: translateX(3.2px) scale(.68); } 100% { transform: translateX(0) scale(1); } }
@keyframes margin-aperture { from { transform: rotate(-9deg) scale(.97); } to { transform: rotate(0) scale(1); } }
@keyframes margin-send { from { transform: translate(-.8px,.5px); } to { transform: translate(0,0); } }
@keyframes margin-shackle { 0%,18% { transform: rotate(-32deg); } 100% { transform: rotate(0); } }
@keyframes margin-page { from { transform: scaleX(.92); } to { transform: scaleX(1); } }
@keyframes margin-draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .margin-icon *, .margin-icon { animation: none !important; transition: none !important; }
}

</style>
<rect x="5.5" y="10" width="13" height="10" rx="3"/><g class="margin-shackle"><path d="M8 10 V7.5 A4 4 0 0 1 16 7.5 V10"/></g>
</svg>
